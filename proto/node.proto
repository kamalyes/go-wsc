 * @LastEditors: kamalyes 501893067@qq.com
 * @LastEditTime: 2026-07-18 00:00:00
 * @FilePath: \go-wsc\proto\node.proto
 * @Description: 节点间 gRPC 通信协议定义
 *
 * 每个 WebSocket Hub 节点同时运行 gRPC 服务端与客户端，支持点对点直连通信
 * 相比 Redis PubSub 广播模式，gRPC 直连可精确路由到目标节点，降低延迟
 * 当 gRPC 未启用或目标地址未知时，自动降级到 Redis PubSub
 *
 * 路由元数据设计（namespace / group_ids）：
 *   - 通过 gRPC metadata headers 传递（非 proto 字段），避免消息体膨胀
 *   - 定义位于独立 routing 包（github.com/kamalyes/go-wsc/routing），全项目共用
 *   - x-routing-namespace：命名空间ID（空表示全局，默认 "default"）
 *   - x-routing-group-ids：群组ID列表（逗号分隔；空表示无群组操作）
 *   - 客户端注入：routing.InjectToOutgoingMetadata（从 context 提取并写入 metadata）
 *   - 服务端恢复：routing.RestoreFromIncomingMetadata（从 metadata 读取并注入 context）
 *
 * Copyright (c) 2026 by kamalyes, All Rights Reserved.
 */

syntax = "proto3";

package wscpb;

option go_package = "github.com/kamalyes/go-wsc/models/pb;wscpb";

// NodeService 节点间 gRPC 通信服务（点对点直连，降低 PubSub 广播延迟）
// [EN] NodeService is the gRPC service for inter-node communication.
service NodeService {
  // SendToUser 向本节点的指定用户发送消息（点对点投递）
  // [EN] Send message to a specific user on this node
  rpc SendToUser(SendToUserRequest) returns (SendToUserResponse);

  // CheckUsersOnline 批量检查用户是否在本节点在线（路由探测）
  // [EN] Batch check if users are online on this node
  rpc CheckUsersOnline(CheckUsersOnlineRequest) returns (CheckUsersOnlineResponse);

  // BroadcastGroup 向本节点的群组成员广播消息
  // [EN] Broadcast message to group members on this node
  rpc BroadcastGroup(BroadcastGroupRequest) returns (BroadcastGroupResponse);

  // NotifyObservers 通知本节点的观察者
  // [EN] Notify observers on this node
  rpc NotifyObservers(NotifyObserversRequest) returns (NotifyObserversResponse);

  // KickUser 踢出本节点上的用户
  // [EN] Kick user on this node
  rpc KickUser(KickUserRequest) returns (KickUserResponse);

  // Ping 节点健康检查
  // [EN] Node health check
  rpc Ping(PingRequest) returns (PingResponse);

  // BatchDispatch 跨节点微批合帧投递（多条指令合并为单次 RPC）
  // [EN] Micro-batch dispatch of multiple inter-node delivery instructions in a single RPC
  rpc BatchDispatch(BatchDispatchRequest) returns (BatchDispatchResponse);
}

// SendToUserRequest 发送消息请求
// [EN] Send message request
message SendToUserRequest {
  string user_id = 1;            // 目标用户ID | [EN] Target user ID
  bytes message_data = 2;        // 序列化后的 HubMessageProto | [EN] Serialized HubMessageProto
}

// SendToUserResponse 发送消息响应
// [EN] Send message response
message SendToUserResponse {
  bool success = 1;              // 是否投递成功 | [EN] Whether delivery succeeded
  string error = 2;              // 失败原因（成功时为空） | [EN] Failure reason (empty on success)
  bool user_online = 3;          // 用户是否在本节点在线 | [EN] Whether user is online on this node
}

// CheckUsersOnlineRequest 批量检查在线状态请求
// [EN] Batch online check request
message CheckUsersOnlineRequest {
  repeated string user_ids = 1;  // 待检查的用户ID列表 | [EN] User IDs to check
}

// CheckUsersOnlineResponse 批量检查在线状态响应
// [EN] Batch online check response
message CheckUsersOnlineResponse {
  map<string, bool> online_users = 1; // userID → 是否在本节点在线 | [EN] userID → online on this node
}

// BroadcastGroupRequest 群组广播请求
// 路由元数据（namespace, group_ids）通过 gRPC metadata 传递，参见文件头注释
// [EN] Group broadcast request. Routing metadata via gRPC metadata headers, see file header.
message BroadcastGroupRequest {
  bytes message_data = 1;          // 序列化后的 HubMessageProto | [EN] Serialized HubMessageProto
  bool exclude_sender = 2;         // 是否排除发送者 | [EN] Whether to exclude sender
  string sender_id = 3;            // 发送者用户ID（用于排除） | [EN] Sender user ID (for exclusion)
}

// BroadcastGroupResponse 群组广播响应
// [EN] Group broadcast response
message BroadcastGroupResponse {
  int32 delivered = 1;           // 本节点投递数量 | [EN] Delivered count on this node
}

// NotifyObserversRequest 观察者通知请求
// 路由元数据（namespace, group_ids）通过 gRPC metadata 传递，参见文件头注释
// [EN] Observer notification request. Routing metadata via gRPC metadata headers, see file header.
message NotifyObserversRequest {
  bytes message_data = 1;          // 序列化后的 HubMessageProto | [EN] Serialized HubMessageProto
}

// NotifyObserversResponse 观察者通知响应
// [EN] Observer notification response
message NotifyObserversResponse {
  int32 notified = 1;            // 本节点通知数量 | [EN] Notified count on this node
}

// KickUserRequest 踢人请求
// [EN] Kick user request
message KickUserRequest {
  string user_id = 1;            // 目标用户ID | [EN] Target user ID
  string reason = 2;             // 踢出原因 | [EN] Kick reason
}

// KickUserResponse 踢人响应
// [EN] Kick user response
message KickUserResponse {
  bool success = 1;              // 是否成功 | [EN] Whether kick succeeded
  int32 kicked_connections = 2;  // 踢出的连接数 | [EN] Kicked connection count
}

// PingRequest 健康检查请求
// [EN] Ping request
message PingRequest {
  string node_id = 1;            // 发起方节点ID | [EN] Source node ID
}

// PingResponse 健康检查响应
// [EN] Ping response
message PingResponse {
  string node_id = 1;            // 响应方节点ID | [EN] Responder node ID
  int64 active_connections = 2;  // 活跃连接数 | [EN] Active connection count
  bool healthy = 3;              // 节点是否健康 | [EN] Whether node is healthy
}

// DispatchOperation 微批投递操作类型（替代裸字符串，枚举语义 + 线型 varint 紧凑编码）
// [EN] Micro-batch delivery operation type (enum instead of raw string).
enum DispatchOperation {
  DISPATCH_OPERATION_UNSPECIFIED = 0; // 未指定（默认值，非法操作）| [EN] Unspecified (default, invalid)
  DISPATCH_SEND_MESSAGE = 1;          // 点对点投递 | [EN] Point-to-point delivery
  DISPATCH_KICK_USER = 2;             // 踢人 | [EN] Kick user
  DISPATCH_GROUP_BROADCAST = 3;       // 群组广播（单群组语义，多群组由发送端拆分为多条 item）| [EN] Group broadcast (single-group)
  DISPATCH_OBSERVER_NOTIFY = 4;       // 观察者通知 | [EN] Observer notification
  DISPATCH_BROADCAST = 5;             // 全局/命名空间广播 | [EN] Global/namespace broadcast
}

// DispatchItem 单条跨节点投递指令（微批合帧最小单元）
// 路由信封（app_id / namespace / group_ids）内嵌于指令体，
// 不依赖 gRPC metadata，支持同批多租户 / 多群组异构合帧
// [EN] A single inter-node delivery instruction (micro-batch unit). Routing envelope embedded.
message DispatchItem {
  DispatchOperation operation = 1; // 操作类型 | [EN] Operation type
  string app_id = 2;               // 路由信封 appID（最上层隔离维度）| [EN] Routing envelope appID
  string namespace = 3;            // 路由信封 namespace（空=全局/通配）| [EN] Routing envelope namespace
  repeated string group_ids = 4;   // 路由信封 groupIDs（群组维度）| [EN] Routing envelope group IDs
  string target_user_id = 5;       // 目标用户（send_message/kick_user 使用）| [EN] Target user ID
  string reason = 6;               // 辅助信息（kick_user 踢人原因）| [EN] Auxiliary info (kick reason)
  bytes message_data = 7;          // 序列化后的 HubMessageProto | [EN] Serialized HubMessageProto
  bool exclude_sender = 8;         // 群组广播是否排除发送者 | [EN] Whether to exclude sender
  string sender_id = 9;            // 发送者用户ID（用于排除）| [EN] Sender user ID (for exclusion)
  string trace_id = 10;            // 全链路追踪ID（每条 item 各自携带，跨节点串联日志）| [EN] Trace ID for full-link correlation
}

// DispatchResult 单条投递结果（与 DispatchItem 一一对应）
// [EN] Per-item dispatch result
message DispatchResult {
  bool success = 1;                // send_message: 是否投递成功; kick_user: 是否成功 | [EN] Whether succeeded
  bool user_online = 2;            // send_message 专用: 用户是否在线 | [EN] Whether user online (send only)
  int32 count = 3;                 // 投递数/踢出连接数/通知数 | [EN] delivered/kicked/notified count
  string error = 4;                // 失败原因（成功时为空）| [EN] Failure reason (empty on success)
}

// BatchDispatchRequest 微批投递请求（多条指令合帧）
// [EN] Micro-batch dispatch request
message BatchDispatchRequest {
  repeated DispatchItem items = 1; // 待投递指令列表 | [EN] Dispatch instructions
}

// BatchDispatchResponse 微批投递响应（结果与请求 items 一一对应）
// [EN] Micro-batch dispatch response
message BatchDispatchResponse {
  repeated DispatchResult results = 1; // 逐条结果 | [EN] Per-item results
}
